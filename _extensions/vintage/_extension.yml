title: Vintage
author: JBS STI
version: 1.1.0
# Thèmes clair et sombre dérivés de `_brand.yml` : vérifié avec Quarto
# 1.10. La borne basse n'a pas été testée sur une version plus ancienne.
quarto-required: ">=1.7.0"
contributes:
  formats:
    html:
      theme:
        light:
          - theme.scss
          - theme-clair.scss
        dark:
          - theme.scss
          - theme-sombre.scss
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      papersize: a4
      margin:
        top: 2.5cm
        bottom: 2.5cm
        left: 2.5cm
        right: 2cm
      page-numbering: "1"
