<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">Deux sites, deux routeurs NAT : inside et outside vus de R1</title>
<desc id="desc">PC1, d’adresse privée 10.10.10.10 et publique 203.0.113.44, est derrière R1. PC2, d’adresse privée 192.168.1.11 et publique 198.51.100.70, est derrière R2. R1 et R2 sont reliés par Internet. Pour R1, PC1 est inside ; Internet, R2 et PC2 sont outside.</desc>
<rect width="1000" height="380" fill="white"/>
<!-- Zones vues de R1 -->
<rect x="10" y="100" width="327" height="170" rx="10" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="10 6"/>
<rect x="393" y="100" width="597" height="170" rx="10" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="2 5"/>
<g fill="none" stroke="#222" stroke-width="3">
<path d="M210 190 H255"/>
<path d="M325 190 H405"/>
<path d="M595 190 H675"/>
<path d="M745 190 H790"/>
</g>
<g fill="#f2f2f2" stroke="#111" stroke-width="2">
<rect x="20" y="145" width="190" height="90" rx="6"/>
<rect x="790" y="145" width="190" height="90" rx="6"/>
</g>
<g fill="#d9d9d9" stroke="#111" stroke-width="3">
<circle cx="290" cy="190" r="35"/>
<circle cx="710" cy="190" r="35"/>
</g>
<ellipse cx="500" cy="190" rx="95" ry="50" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<g font-family="sans-serif" fill="#111" text-anchor="middle">
<text x="173" y="88" font-size="15" font-weight="bold">inside pour R1 (tirets)</text>
<text x="691" y="88" font-size="15" font-weight="bold">outside pour R1 (pointillés)</text>
<text x="115" y="170" font-size="16" font-weight="bold">PC1</text>
<text x="885" y="170" font-size="16" font-weight="bold">PC2</text>
<text x="290" y="197" font-size="18" font-weight="bold">R1</text>
<text x="710" y="197" font-size="18" font-weight="bold">R2</text>
<text x="500" y="196" font-size="17" font-weight="bold">Internet</text>
<text x="500" y="320" font-size="15" font-style="italic">Pour R2, les rôles s’inversent : PC2 est inside, PC1 est outside.</text>
</g>
<g font-family="monospace" font-size="13" fill="#111" text-anchor="middle">
<text x="115" y="196">privée 10.10.10.10</text>
<text x="115" y="218">publique 203.0.113.44</text>
<text x="885" y="196">privée 192.168.1.11</text>
<text x="885" y="218">publique 198.51.100.70</text>
</g>
</svg>
