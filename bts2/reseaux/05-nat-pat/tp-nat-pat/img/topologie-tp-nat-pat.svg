<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc">
<title id="title">Topologie du TP NAT et PAT</title>
<desc id="desc">Réseau du TP 6, relié à un Internet simulé. En haut, dans un cadre en tirets « Internet simulé » : le routeur FAI, dont G0/1 point 1 est relié au commutateur SW-EXT, réseau 192.0.2.0/24 ; sur SW-EXT, SRV-EXT 192.0.2.80 sur F0/1 et PC-EXT 192.0.2.10 sur F0/2. Le FAI n'a aucune route vers 192.168.10.0/24 ; il route le bloc public 198.51.100.8/29 vers FW. Liaison FAI–FW : 198.51.100.0/30, FAI G0/0 point 1, FW G0/2 point 2, interface outside. Une ligne pointillée horizontale sépare le côté outside, aux adresses publiques, du côté inside, aux adresses privées. Les routeurs R1, R2 et FW forment un triangle. Liaison R1–R2 : 192.168.10.224/30, R2 G0/0 point 226, R1 G0/1 point 225. Liaison R2–FW : 192.168.10.228/30, R2 G0/1 point 229, FW G0/0 point 230, inside. Liaison R1–FW : 192.168.10.232/30, R1 G0/2 point 233, FW G0/1 point 234, inside. R1 G0/0 est relié en trunk à SW1 G0/1 ; SW1 G0/2 est relié en trunk 802.1Q à SW2 G0/1. Sur SW2 : PC-P2 sur F0/2 en VLAN 10 et PC-I1 sur F0/21 en VLAN 30, en DHCP. Sur SW1 : PC-P1 sur F0/1 en VLAN 10, en DHCP ; PC-ADM sur F0/11 en VLAN 20, adresse 192.168.10.129 ; SRV-WEB sur F0/5 en VLAN 10, adresse 192.168.10.101, publiée sous 198.51.100.9. Les nouveaux équipements FAI, SW-EXT, SRV-EXT et PC-EXT ont un cadre épais.</desc>
