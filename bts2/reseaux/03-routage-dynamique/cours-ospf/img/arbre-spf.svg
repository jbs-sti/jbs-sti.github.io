<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Arbre des plus courts chemins calculé par R1</title>
<desc id="desc">R1 est la racine. Il atteint LAN1 avec un coût 1, R2 et R3 avec un coût 1, LAN2 et LAN3 avec un coût total de 2. Le lien entre R2 et R3 est connu mais ne fait pas partie de l’arbre.</desc>
<rect width="800" height="500" fill="white"/>
<!-- Branches de l’arbre : traits épais -->
<g fill="none" stroke="#111" stroke-width="6">
<path d="M400 90 L220 260"/>
<path d="M400 90 L580 260"/>
<path d="M362 90 H280"/>
<path d="M220 298 V370"/>
<path d="M580 298 V370"/>
</g>
<!-- Lien connu mais hors de l’arbre : tirets fins -->
<path d="M258 260 H542" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="10 8"/>
<g fill="white" stroke="#111" stroke-width="3">
<circle cx="400" cy="90" r="38"/>
<circle cx="220" cy="260" r="38"/>
<circle cx="580" cy="260" r="38"/>
</g>
<g fill="#eee" stroke="#111" stroke-width="2">
<rect x="60" y="62" width="220" height="56"/>
<rect x="110" y="370" width="220" height="56"/>
<rect x="470" y="370" width="220" height="56"/>
</g>
<g font-family="sans-serif" fill="#111" text-anchor="middle">
<text x="400" y="88" font-size="21" font-weight="bold">R1</text>
<text x="400" y="108" font-size="13">racine</text>
<text x="220" y="267" font-size="21" font-weight="bold">R2</text>
<text x="580" y="267" font-size="21" font-weight="bold">R3</text>
<g font-size="16">
<text x="170" y="86" font-weight="bold">LAN1</text>
<text x="170" y="108">coût total 1</text>
<text x="220" y="394" font-weight="bold">LAN2</text>
<text x="220" y="416">coût total 2</text>
<text x="580" y="394" font-weight="bold">LAN3</text>
<text x="580" y="416">coût total 2</text>
</g>
</g>
<!-- Coûts des interfaces de sortie -->
<g font-family="sans-serif" fill="#111" font-size="18" font-weight="bold">
<text x="320" y="70" text-anchor="middle">1</text>
<text x="288" y="180" text-anchor="end">1</text>
<text x="505" y="180" text-anchor="start">1</text>
<text x="232" y="340" text-anchor="start">1</text>
<text x="592" y="340" text-anchor="start">1</text>
<text x="400" y="250" text-anchor="middle">1</text>
</g>
<g font-family="sans-serif" fill="#111" font-size="15">
<text x="150" y="225" text-anchor="middle">coût total 1</text>
<text x="650" y="225" text-anchor="middle">coût total 1</text>
<text x="400" y="285" text-anchor="middle">lien R2–R3 : hors de l’arbre</text>
</g>
<g font-family="sans-serif" fill="#111" font-size="14" text-anchor="middle">
<text x="400" y="460">Trait épais : branche de l’arbre de R1 ; tirets : lien connu mais non utilisé.</text>
<text x="400" y="482">Chiffre sur un trait : coût de l’interface de sortie. Vue simplifiée.</text>
</g>
</svg>
