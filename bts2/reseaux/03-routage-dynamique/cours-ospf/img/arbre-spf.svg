<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-labelledby="title desc">
<title id="title">SPF depuis R1 : coût 21 par Lyon, contre 31 en direct</title>
<desc id="desc">Chemin choisi en trait épais de R1 vers R2, coût 10, puis R3, coût 10, puis le LAN Marseille, coût 1. Chemin direct en tirets de R1 vers R3, coût 30. Les coûts interrouteurs sont réglés dans les deux sens.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker></defs>
<rect width="900" height="385" fill="white"/>
<g font-family="sans-serif" font-size="18" fill="#111" text-anchor="middle">

<g fill="none" stroke="#111" stroke-width="6">
<path d="M120 210 L440 80 L760 210 V282"/>
</g>
<path d="M160 210 H720" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="10 7"/>
<g fill="white" stroke="#111" stroke-width="3">
<circle cx="120" cy="210" r="36"/><circle cx="440" cy="80" r="36"/><circle cx="760" cy="210" r="36"/>
</g>
<g font-size="22" font-weight="bold">
<text x="120" y="217">R1</text><text x="440" y="87">R2</text><text x="760" y="217">R3</text>
</g>
<text x="440" y="28">Lyon</text><text x="120" y="267">Paris</text><text x="815" y="165">Marseille</text>
<g font-weight="bold">
<text x="265" y="123">coût 10</text><text x="617" y="123">coût 10</text>
<text x="440" y="199">coût direct 30</text>
<text x="824" y="267">coût 1</text>
</g>
<text x="440" y="267" font-weight="bold">Par R2 : 10 + 10 + 1 = 21</text>
<text x="440" y="302">Direct : 30 + 1 = 31</text>
<rect x="650" y="282" width="220" height="48" fill="#eee" stroke="#111" stroke-width="2"/>
<text x="760" y="313">192.168.3.0/24</text>
<text x="450" y="354" font-size="16">Trait épais : chemin retenu ; tirets : chemin disponible.</text>
<text x="450" y="377" font-size="16">Coûts interrouteurs identiques dans les deux sens.</text>

</g>
</svg>
