<svg xmlns="http://www.w3.org/2000/svg" width="900" height="365" viewBox="0 0 900 365" role="img" aria-labelledby="title desc">
<title id="title">HexaTech : trois sites et une liaison de secours</title>
<desc id="desc">Paris R1, Lyon R2 et Marseille R3 en chaîne. La future liaison directe Paris–Marseille est en tirets. Un LAN /24 dessert chaque site.</desc>
