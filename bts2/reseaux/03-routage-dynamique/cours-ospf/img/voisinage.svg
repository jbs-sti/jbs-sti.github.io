<svg xmlns="http://www.w3.org/2000/svg" width="900" height="185" viewBox="0 0 900 185" role="img" aria-labelledby="title desc">
<title id="title">OSPF : des voisins aux routes en quatre étapes</title>
<desc id="desc">Hello découvre les voisins, les LSA décrivent les liens, la LSDB constitue la carte commune de l’aire 0, puis SPF calcule les chemins et les routes de chaque routeur.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker></defs>
<rect width="900" height="185" fill="white"/>
<g font-family="sans-serif" font-size="18" fill="#111" text-anchor="middle">

<g fill="#eee" stroke="#222" stroke-width="2">
<rect x="10" y="15" width="195" height="125" rx="5"/>
<rect x="238" y="15" width="195" height="125" rx="5"/>
<rect x="466" y="15" width="195" height="125" rx="5"/>
<rect x="694" y="15" width="195" height="125" rx="5"/>
</g>
<g fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)">
<path d="M207 78 H234"/><path d="M435 78 H462"/><path d="M663 78 H690"/>
</g>
<g font-weight="bold">
<text x="107" y="47">1. Hello</text><text x="335" y="47">2. LSA</text>
<text x="563" y="47">3. LSDB</text><text x="791" y="47">4. SPF</text>
</g>
<text x="107" y="80">Découvrir</text><text x="107" y="108">les voisins</text>
<text x="335" y="80">Échanger l’état</text><text x="335" y="108">des liens</text>
<text x="563" y="80">Construire</text><text x="563" y="108">la carte de l’aire</text>
<text x="791" y="80">Calculer</text><text x="791" y="108">les routes</text>
<text x="450" y="171" font-size="16">Aire 0 : une carte commune ; chaque routeur calcule ses propres chemins avec SPF (Dijkstra).</text>

</g>
</svg>
