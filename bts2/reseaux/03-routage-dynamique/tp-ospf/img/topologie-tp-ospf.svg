<svg xmlns="http://www.w3.org/2000/svg" width="820" height="545" viewBox="0 0 820 545" role="img" aria-labelledby="title desc">
<title id="title">Topologie du TP OSPF</title>
<desc id="desc">Les routeurs R1, R2 et FW forment un triangle. FW, router-id 3.3.3.3, est en haut ; derrière lui, Internet est simulé par sa Loopback0 203.0.113.1/32. R2, router-id 2.2.2.2, est à gauche ; R1, router-id 1.1.1.1, est à droite. Liaison R1–R2 : 192.168.10.224/30, R2 G0/0 point 226, R1 G0/1 point 225. Liaison R2–FW : 192.168.10.228/30, R2 G0/1 et FW G0/0. Nouvelle liaison R1–FW, en trait épais : 192.168.10.232/30, R1 G0/2 et FW G0/1. R1 G0/0 est relié en trunk à SW1 G0/1 ; SW1 G0/2 est relié en trunk 802.1Q à SW2 G0/1. Sur SW2 : PC-P2 sur F0/2 en VLAN 10 et PC-I1 sur F0/21 en VLAN 30. Sur SW1 : PC-P1 sur F0/1 en VLAN 10 et PC-ADM sur F0/11 en VLAN 20.</desc>
