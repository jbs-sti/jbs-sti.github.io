<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210">
  <title>Lycée : routage entre VLAN 10 PROFS et VLAN 20 ELEVES</title>
  <desc>R1, un 2911, rejoint SW1 par un trunk de G0/0 à Gi0/2. Les sous-interfaces portent les passerelles en .254. SW1 et SW2, des 2960, sont reliés par Gi0/1 en trunk. Chaque commutateur dessert un professeur du VLAN 10 et un élève du VLAN 20. Tous les masques sont /24.</desc>
  <rect width="1000" height="210" fill="#fff"/>
  <g fill="none" stroke="#222" stroke-width="2">
    <path d="M266 49V95 M274 49V95 M310 111H690 M310 119H690"/>
    <path d="M150 154V145H250V135 M365 154V145H290V135 M635 154V145H710V135 M850 154V145H750V135"/>
  </g>
  <g stroke="#222" stroke-width="2">
    <rect x="220" y="9" width="100" height="40" rx="14" fill="#bbb"/>
    <rect x="230" y="95" width="80" height="40" rx="4" fill="#ddd"/>
    <rect x="690" y="95" width="80" height="40" rx="4" fill="#ddd"/>
    <rect x="42" y="154" width="216" height="49" rx="4" fill="#fff"/>
    <rect x="260" y="154" width="210" height="49" rx="4" fill="#eee"/>
    <rect x="527" y="154" width="216" height="49" rx="4" fill="#fff"/>
    <rect x="745" y="154" width="210" height="49" rx="4" fill="#eee"/>
  </g>
  <g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#111">
    <text x="270" y="35" font-weight="bold">R1 · 2911</text>
    <text x="237" y="67">G0/0</text><text x="235" y="89">Gi0/2</text>
    <text x="285" y="77" text-anchor="start" font-weight="bold">trunk 802.1Q</text>
    <text x="350" y="25" text-anchor="start">G0/0.10 · VLAN 10 · passerelle 192.168.10.254/24</text>
    <text x="350" y="47" text-anchor="start">G0/0.20 · VLAN 20 · passerelle 192.168.20.254/24</text>
    <text x="270" y="112" font-weight="bold">SW1</text><text x="270" y="128" font-size="13">2960</text>
    <text x="730" y="112" font-weight="bold">SW2</text><text x="730" y="128" font-size="13">2960</text>
    <text x="500" y="100" font-weight="bold">trunk 802.1Q · VLAN 10 et 20</text>
    <text x="342" y="136">Gi0/1</text><text x="658" y="136">Gi0/1</text>
    <text x="150" y="174" font-weight="bold">P1 · VLAN 10 PROFS</text><text x="150" y="195">192.168.10.11/24</text>
    <text x="365" y="174" font-weight="bold">E1 · VLAN 20 ELEVES</text><text x="365" y="195">192.168.20.11/24</text>
    <text x="635" y="174" font-weight="bold">P2 · VLAN 10 PROFS</text><text x="635" y="195">192.168.10.12/24</text>
    <text x="850" y="174" font-weight="bold">E2 · VLAN 20 ELEVES</text><text x="850" y="195">192.168.20.12/24</text>
  </g>
</svg>
