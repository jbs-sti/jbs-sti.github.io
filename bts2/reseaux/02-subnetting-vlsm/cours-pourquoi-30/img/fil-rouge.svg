<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250" role="img" aria-labelledby="title desc">
<title id="title">Réseau fil rouge : liaisons entre routeurs</title>
<desc id="desc">Le pare-feu FW est relié au routeur R2 par le réseau 192.168.10.228/30, R2 est relié au routeur R1 par le réseau 192.168.10.224/30. R1 est relié par un trunk au commutateur SW1, qui porte les VLAN 10, 20 et 30.</desc>
<rect width="700" height="250" fill="white"/>
<g fill="none" stroke="#222" stroke-width="2">
<rect x="20" y="35" width="120" height="50" rx="6"/>
<rect x="290" y="35" width="120" height="50" rx="6"/>
<rect x="560" y="35" width="120" height="50" rx="6"/>
<rect x="560" y="170" width="120" height="50" rx="6"/>
<path d="M140 60 H290 M410 60 H560"/>
<path d="M615 85 V170 M625 85 V170"/>
</g>
<g font-family="sans-serif" fill="#111" text-anchor="middle">
<text x="80" y="66" font-size="18" font-weight="bold">FW</text>
<text x="350" y="66" font-size="18" font-weight="bold">R2</text>
<text x="620" y="66" font-size="18" font-weight="bold">R1</text>
<text x="620" y="201" font-size="18" font-weight="bold">SW1</text>
<text x="215" y="90" font-size="16">192.168.10.228/30</text>
<text x="485" y="90" font-size="16">192.168.10.224/30</text>
<text x="545" y="190" font-size="15" text-anchor="end">VLAN 10, 20, 30</text>
<text x="545" y="140" font-size="14" text-anchor="end">trunk 802.1Q (trait double)</text>
</g></svg>
