<svg xmlns="http://www.w3.org/2000/svg" width="820" height="345" viewBox="0 0 820 345" role="img" aria-labelledby="title desc">
<title id="title">Topologie de l’exemple guidé : 192.168.10.0/24 découpé en VLSM</title>
<desc id="desc">Trois routeurs en ligne. R1 est relié à R2 par la liaison 192.168.10.224/30 : R1 en .225, R2 en .226. R2 est relié à R3 par la liaison 192.168.10.228/30 : R2 en .229, R3 en .230. Sous R1, le commutateur SW-A dessert le LAN A, 100 PC, réseau 192.168.10.0/25, passerelle .1. Sous R2, SW-B dessert le LAN B, 50 PC, réseau 192.168.10.128/26, passerelle .129. Sous R3, SW-C dessert le LAN C, 25 PC, réseau 192.168.10.192/27, passerelle .193.</desc>
<rect width="820" height="345" fill="white"/>
<g fill="none" stroke="#222" stroke-width="2">
<ellipse cx="120" cy="85" rx="60" ry="25"/>
<ellipse cx="410" cy="85" rx="60" ry="25"/>
<ellipse cx="700" cy="85" rx="60" ry="25"/>
<path d="M180 85 H350 M470 85 H640"/>
<path d="M120 110 V165 M410 110 V165 M700 110 V165"/>
<rect x="70" y="165" width="100" height="40" rx="2"/>
<rect x="360" y="165" width="100" height="40" rx="2"/>
<rect x="650" y="165" width="100" height="40" rx="2"/>
<path d="M120 205 V235 M410 205 V235 M700 205 V235"/>
<g stroke-dasharray="6 4">
<rect x="20" y="235" width="200" height="95" rx="8"/>
<rect x="310" y="235" width="200" height="95" rx="8"/>
<rect x="600" y="235" width="200" height="95" rx="8"/>
</g>
</g>
<g font-family="sans-serif" fill="#111" text-anchor="middle">
<g font-size="18" font-weight="bold">
<text x="120" y="91">R1</text><text x="410" y="91">R2</text><text x="700" y="91">R3</text>
</g>
<g font-size="15">
<text x="120" y="190">SW-A</text><text x="410" y="190">SW-B</text><text x="700" y="190">SW-C</text>
</g>
<g font-size="13">
<text x="265" y="74" font-weight="bold">R1–R2</text>
<text x="265" y="106">192.168.10.224/30</text>
<text x="188" y="74" text-anchor="start">.225</text>
<text x="342" y="74" text-anchor="end">.226</text>
<text x="555" y="74" font-weight="bold">R2–R3</text>
<text x="555" y="106">192.168.10.228/30</text>
<text x="478" y="74" text-anchor="start">.229</text>
<text x="632" y="74" text-anchor="end">.230</text>
<text x="128" y="142" text-anchor="start">.1</text>
<text x="418" y="142" text-anchor="start">.129</text>
<text x="708" y="142" text-anchor="start">.193</text>
</g>
<g font-size="15" font-weight="bold">
<text x="120" y="258">LAN A</text><text x="410" y="258">LAN B</text><text x="700" y="258">LAN C</text>
</g>
<g font-size="14">
<text x="120" y="280">100 PC</text><text x="410" y="280">50 PC</text><text x="700" y="280">25 PC</text>
<text x="120" y="301">192.168.10.0/25</text><text x="410" y="301">192.168.10.128/26</text><text x="700" y="301">192.168.10.192/27</text>
<text x="120" y="321">passerelle .1</text><text x="410" y="321">passerelle .129</text><text x="700" y="321">passerelle .193</text>
</g>
