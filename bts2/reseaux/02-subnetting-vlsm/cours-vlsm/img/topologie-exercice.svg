<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="title desc">
<title id="title">Topologie de l’exercice : cinq routeurs, quatre LAN, réseau parent 10.6.0.0/15</title>
<desc id="desc">En haut, de gauche à droite : R1, relié à R2 par un câble Ethernet croisé ; R2 relié au commutateur SW2 ; SW2 relié à R4. SW2 forme le LAN 2 : 252 PC plus R2, R3 et R4. Sous R1, le commutateur SW1 forme le LAN 1 : 600 PC plus R1. Sous SW2, le routeur R3, puis le commutateur SW3 qui forme le LAN 3 : 25 PC plus R3. Sous R4, une liaison série, dessinée en zigzag, mène à R5 ; sous R5, le commutateur SW4 forme le LAN 4 : 900 PC plus R5. Les routeurs sont des ellipses, les commutateurs des rectangles.</desc>
<rect width="860" height="470" fill="white"/>
<g fill="none" stroke="#222" stroke-width="2">
<ellipse cx="90" cy="90" rx="50" ry="24"/>
<ellipse cx="330" cy="90" rx="50" ry="24"/>
<rect x="470" y="70" width="100" height="40" rx="2"/>
<ellipse cx="740" cy="90" rx="50" ry="24"/>
<path d="M140 90 H280 M380 90 H470 M570 90 H690"/>
<path d="M90 114 V180"/>
<rect x="40" y="180" width="100" height="40" rx="2"/>
<path d="M520 110 V180"/>
<ellipse cx="520" cy="204" rx="50" ry="24"/>
<path d="M520 228 V290"/>
<rect x="470" y="290" width="100" height="40" rx="2"/>
<path d="M740 114 V135 L755 145 L725 160 L755 175 L725 190 L740 198 V206"/>
<ellipse cx="740" cy="230" rx="50" ry="24"/>
<path d="M740 254 V310"/>
<rect x="690" y="310" width="100" height="40" rx="2"/>
</g>
<g font-family="sans-serif" fill="#111" text-anchor="middle">
<g font-size="18" font-weight="bold">
<text x="90" y="96">R1</text><text x="330" y="96">R2</text><text x="740" y="96">R4</text>
<text x="520" y="210">R3</text><text x="740" y="236">R5</text>
</g>
<g font-size="15">
<text x="520" y="95">SW2</text><text x="90" y="205">SW1</text>
<text x="520" y="315">SW3</text><text x="740" y="335">SW4</text>
</g>
<text x="210" y="78" font-size="13">Ethernet croisé</text>
<text x="765" y="172" font-size="13" text-anchor="start">Série</text>
<text x="520" y="45" font-size="15" font-weight="bold">LAN 2 : 252 PC + R2, R3, R4</text>
<g font-size="15" font-weight="bold">
<text x="90" y="250">LAN 1</text><text x="520" y="360">LAN 3</text><text x="740" y="380">LAN 4</text>
</g>
<g font-size="14">
<text x="90" y="270">600 PC + R1</text><text x="520" y="380">25 PC + R3</text><text x="740" y="400">900 PC + R5</text>
</g>
<text x="430" y="450" font-size="14" font-style="italic">R2, R3 et R4 partagent le même LAN 2 via SW2.</text>
</g>
</svg>
