<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Plan VLSM de 192.168.10.0/24</title>
  <desc id="desc">Règle du /24 : LAN A en .0/25, LAN B en .128/26, LAN C en .192/27. Zoom de .224 à la fin du /24 : R1–R2 en .224/30, R2–R3 en .228/30, espace libre de .232 à .255. Les barres sont proportionnelles dans chaque règle ; le zoom a sa propre échelle. La borne 256 marque la fin du /24, pas une valeur d’octet.</desc>
  <defs>
    <pattern id="libre" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fff"/>
      <path d="M0 8 L8 0" stroke="#bbb" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="390" fill="#fff"/>
  <g stroke="#111" stroke-width="2">
    <rect x="60" y="85" width="416" height="55" fill="#ddd"/>
    <rect x="476" y="85" width="208" height="55" fill="#fff"/>
    <rect x="684" y="85" width="104" height="55" fill="#ddd"/>
    <rect x="788" y="85" width="13" height="55" fill="#ddd"/>
    <rect x="801" y="85" width="13" height="55" fill="#fff"/>
    <rect x="814" y="85" width="78" height="55" fill="url(#libre)"/>
    <path d="M60 77 V148 M476 77 V148 M684 77 V148 M788 77 V148 M892 77 V148"/>
    <rect x="160" y="225" width="88" height="55" fill="#ddd"/>
    <rect x="248" y="225" width="88" height="55" fill="#fff"/>
    <rect x="336" y="225" width="528" height="55" fill="url(#libre)"/>
    <path d="M160 217 V288 M248 217 V288 M336 217 V288 M864 217 V288"/>
  </g>
  <rect x="420" y="236" width="360" height="32" fill="#fff"/>
  <g font-family="sans-serif" fill="#111">
    <text x="30" y="30" font-size="22" font-weight="bold">192.168.10.0/24 : chaque segment reçoit son bloc</text>
    <text x="30" y="59" font-size="19">Les graduations indiquent le dernier octet, au début de chaque bloc.</text>
    <g text-anchor="middle" font-size="18">
      <text x="268" y="108">LAN A /25</text>
      <text x="268" y="131">128 adresses</text>
      <text x="580" y="108">LAN B /26</text>
      <text x="580" y="131">64 adresses</text>
      <text x="736" y="108">LAN C</text>
      <text x="736" y="131">/27</text>
      <text x="60" y="173">0</text>
      <text x="476" y="173">128</text>
      <text x="684" y="173">192</text>
      <text x="788" y="173">224</text>
      <text x="892" y="173">256*</text>
    </g>
    <text x="30" y="211" font-size="19" font-weight="bold">Zoom : les liaisons et l’espace libre</text>
    <g text-anchor="middle" font-size="18">
      <text x="204" y="248">R1–R2</text>
      <text x="204" y="271">/30</text>
      <text x="292" y="248">R2–R3</text>
      <text x="292" y="271">/30</text>
      <text x="600" y="258">Libre : 24 adresses, de .232 à .255</text>
      <text x="160" y="313">224</text>
      <text x="248" y="313">228</text>
      <text x="336" y="313">232</text>
      <text x="864" y="313">256*</text>
    </g>
    <text x="30" y="351" font-size="18">Chaque /30 contient 4 adresses : réseau, 2 utilisables, diffusion.</text>
    <text x="30" y="380" font-size="17">* 256 marque la fin du /24 ; ce n’est pas une valeur d’octet.</text>
  </g>
</svg>
