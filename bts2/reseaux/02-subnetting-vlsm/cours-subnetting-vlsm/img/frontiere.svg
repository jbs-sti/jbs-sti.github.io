<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
  <title id="title">La frontière entre réseau et hôtes</title>
  <desc id="desc">En haut, /24 : 24 bits réseau et 8 bits hôtes. En bas, /26 : 26 bits réseau et 6 bits hôtes. Deux bits hôtes sont empruntés. Les séparations d’octets sont marquées. Le dernier octet du masque /26 est 11|000000, soit 128 + 64 = 192.</desc>
  <rect width="960" height="310" fill="#fff"/>
  <rect x="155" y="95" width="570" height="55" fill="#dedede" stroke="#111" stroke-width="2"/>
  <rect x="725" y="95" width="190" height="55" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="155" y="195" width="617" height="55" fill="#dedede" stroke="#111" stroke-width="2"/>
  <rect x="772" y="195" width="143" height="55" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M725 75 V265" stroke="#111" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M772 175 V265" stroke="#111" stroke-width="3"/>
  <path d="M345 95 V150 M535 95 V150 M345 195 V250 M535 195 V250" stroke="#111" stroke-width="2"/>
  <path d="M725 270 H772 M725 263 V277 M772 263 V277" stroke="#111" stroke-width="2"/>
  <g font-family="sans-serif" fill="#111">
    <text x="35" y="32" font-size="22" font-weight="bold">Adresse IPv4 : 32 bits, séparés en quatre octets</text>
    <text x="35" y="60" font-size="19">Masque /26 : 24 bits à 1, puis 11|000000 = 128 + 64 = 192</text>
    <text x="35" y="128" font-size="22">/24</text>
    <text x="35" y="228" font-size="22">/26</text>
    <text x="175" y="128" font-size="19">24 bits réseau</text>
    <text x="748" y="128" font-size="19">8 bits hôtes</text>
    <text x="175" y="228" font-size="19">26 bits réseau</text>
    <text x="786" y="228" font-size="18">6 bits hôtes</text>
    <text x="748.5" y="294" text-anchor="middle" font-size="16">2 bits empruntés</text>
  </g>
</svg>
