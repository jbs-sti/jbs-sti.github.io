project:
  type: website
  # Seuls les .qmd sont des pages du site : ça exclut automatiquement
  # docs/ (documentation interne) et tout fichier .md égaré ailleurs
  # dans le dépôt (par exemple un fichier sans rapport trouvé dans
  # design/reference/, qui autrement casse le rendu PDF du site entier).
  render:
    - "*.qmd"
    - "**/*.qmd"

# Langue de toute l'interface : Quarto traduit en français ses propres
# libellés (« Sur cette page », « Retour au sommet », « Catégories »,
# « Toutes », titres des encadrés, boutons de recherche…), en HTML comme
# dans le PDF.
lang: fr

# Schémas TikZ : code natif dans le PDF, SVG compilé par dvisvgm dans le
# HTML (voir _extensions/vintage/tikz.lua).
filters:
  - _extensions/vintage/tikz.lua

website:
  title: "Informatique"
  navbar:
    left:
      - href: index.qmd
        text: Accueil
      - href: snt/index.qmd
        text: SNT
      - href: bts1/index.qmd
        text: BTS CIEL 1
      - href: bts2/index.qmd
        text: BTS CIEL 2
    search: true
  sidebar:
    - id: snt
      title: "SNT"
      contents: snt
    - id: bts1
      title: "BTS CIEL 1"
      contents: bts1
    - id: bts2
      title: "BTS CIEL 2"
      contents: bts2

format:
  html:
    # Un seul thème, « encre sur papier » (DESIGN.md). Les couleurs et la
    # police viennent de `_brand.yml`, les composants de theme.scss.
    theme:
      - cosmo
      - brand
      - _extensions/vintage/theme.scss
    # Une seule coloration syntaxique, claire : pas de thème sombre.
    highlight-style: github
    toc: true
  vintage-pdf: default

format-links:
  - format: vintage-pdf
    text: "Télécharger le PDF"
    icon: file-pdf
