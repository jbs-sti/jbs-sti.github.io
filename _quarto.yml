project:
  type: website
  # Seuls les .qmd sont des pages du site : ça exclut automatiquement
  # docs/ (documentation interne) et tout fichier .md égaré ailleurs
  # dans le dépôt (par exemple un fichier sans rapport trouvé dans
  # design/reference/, qui autrement casse le rendu PDF du site entier).
  render:
    - "*.qmd"
    - "**/*.qmd"

# Langue de toute l'interface : Quarto traduit en français ses propres
# libellés (« Sur cette page », « Retour au sommet », « Catégories »,
# « Toutes », titres des encadrés, boutons de recherche…), en HTML comme
# dans le PDF.
lang: fr

website:
  title: "Informatique"
  navbar:
    left:
      - href: index.qmd
        text: Accueil
      - href: snt/index.qmd
        text: SNT
      - href: bts1/index.qmd
        text: BTS CIEL 1
      - href: bts2/index.qmd
        text: BTS CIEL 2
    search: true
  sidebar:
    - id: snt
      title: "SNT"
      contents: snt
    - id: bts1
      title: "BTS CIEL 1"
      contents: bts1
    - id: bts2
      title: "BTS CIEL 2"
      contents: bts2

format:
  html:
    # Deux thèmes, un bouton de bascule dans la barre de navigation. Les
    # couleurs de chaque thème viennent de `_brand.yml` (valeurs `light`
    # et `dark` de chaque rôle), les surfaces et les filets des deux
    # fichiers theme-clair.scss / theme-sombre.scss.
    theme:
      light:
        - cosmo
        - brand
        - _extensions/vintage/theme.scss
        - _extensions/vintage/theme-clair.scss
      dark:
        - cosmo
        - brand
        - _extensions/vintage/theme.scss
        - _extensions/vintage/theme-sombre.scss
    # À la première visite, le site suit le réglage clair/sombre du
    # système ; le bouton de la barre de navigation permet de choisir
    # l'autre thème, et ce choix est mémorisé par le navigateur.
    respect-user-color-scheme: true
    toc: true
  vintage-typst: default

format-links:
  - format: vintage-typst
    text: "Télécharger le PDF"
    icon: file-pdf
