project:
  type: website
  # Seuls les .qmd sont des pages du site : ça exclut automatiquement
  # docs/ (documentation interne) et tout fichier .md égaré ailleurs
  # dans le dépôt (par exemple un fichier sans rapport trouvé dans
  # design/reference/, qui autrement casse le rendu PDF du site entier).
  render:
    - "*.qmd"
    - "**/*.qmd"

website:
  title: "Informatique"
  navbar:
    left:
      - href: index.qmd
        text: Accueil
      - href: snt/index.qmd
        text: SNT
      - href: bts1/index.qmd
        text: BTS CIEL 1
      - href: bts2/index.qmd
        text: BTS CIEL 2
    search: true
  sidebar:
    - id: snt
      title: "SNT"
      contents: snt
    - id: bts1
      title: "BTS CIEL 1"
      contents: bts1
    - id: bts2
      title: "BTS CIEL 2"
      contents: bts2

format:
  html:
    # Un seul thème volontairement sombre : on fixe light et dark au même
    # jeu de fichiers pour empêcher Quarto de générer automatiquement un
    # second thème par inversion des couleurs de _brand.yml (non maîtrisé,
    # jamais demandé). Le bouton de bascule clair/sombre est masqué dans
    # theme.scss puisque les deux états seraient identiques.
    theme:
      light: &theme-vintage
        - cosmo
        - brand
        - _extensions/vintage/theme.scss
      dark: *theme-vintage
    toc: true
  vintage-typst: default

format-links:
  - format: vintage-typst
    text: "Télécharger le PDF"
    icon: file-pdf
