meta:
  name: "JBS STI"

# Charte « encre sur papier » (voir DESIGN.md). Les valeurs hexadécimales
# ne s'écrivent qu'ici : le SCSS les relit par leur nom, et les pages par
# les variables CSS --papier, --encre, etc. définies dans theme.scss.
# Attention : un nom de couleur devient un identifiant Typst (cours rendus
# en Typst) ; jamais de mot réservé (`or`, `and`, `not`, `in`, `if`…).
color:
  palette:
    papier: "#F4F2EC"
    papier-2: "#ECE9E0"
    encre: "#16150F"
    encre-2: "#4A4840"
    encre-3: "#6E6B62"
    contour: "#8C8980"
    jaune: "#F6D77A"
    dore: "#D9A21B"
    bleu: "#9CC3E6"
    rouge: "#C8372D"
    vert: "#2F6B4F"
    blanc: "#FFFFFF"
  foreground: encre
  background: papier
  primary: encre
  secondary: encre-2
  tertiary: encre-3
  success: vert
  info: bleu
  warning: dore
  danger: rouge
  light: papier-2
  dark: encre

# Nunito, police variable (axe de graisse 200 à 1000 ; le 1000 est demandé en SCSS par
# font-variation-settings, la brand n'acceptant que 100 à 900), fichier local : aucun
# appel à un service tiers. Un même fichier sert chaque graisse déclarée.
typography:
  fonts:
    - family: "Nunito"
      source: file
      files:
        - path: _extensions/vintage/fonts/Nunito-VF.ttf
          weight: 400
          style: normal
        - path: _extensions/vintage/fonts/Nunito-VF.ttf
          weight: 700
          style: normal
        - path: _extensions/vintage/fonts/Nunito-VF.ttf
          weight: 900
          style: normal
  base:
    family: "Nunito"
    size: "1.05em"
    line-height: 1.65
  headings:
    family: "Nunito"
    weight: 900
  monospace:
    size: "0.9em"
