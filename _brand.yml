meta:
  name: "JBS STI"

color:
  palette:
    vert-profond: "#1C322D"
    creme: "#F8F3EE"
    dore: "#EBB552"
    rose-poudre: "#F1CDBE"
    gris: "#A1A1AA"
  # Deux thèmes, une seule palette : chaque rôle de couleur donne sa valeur
  # claire et sa valeur sombre. Quarto en déduit automatiquement les deux
  # feuilles de style et le bouton de bascule dans la barre de navigation
  # (voir `theme` dans `_quarto.yml`).
  #
  #   clair  : fond crème, texte vert-profond — contraste ≈ 12,3:1
  #   sombre : fond vert-profond, texte crème — contraste ≈ 12,3:1
  #
  # L'or ne sert de couleur de texte que sur fond sombre (≈ 7,3:1) ; sur
  # crème il reste décoratif (filets, bordures), jamais du texte courant.
  foreground:
    light: vert-profond
    dark: creme
  background:
    light: creme
    dark: vert-profond
  primary:
    light: vert-profond
    dark: dore
  secondary:
    light: gris
    dark: rose-poudre
  tertiary: gris
  success:
    light: vert-profond
    dark: dore
  info:
    light: vert-profond
    dark: rose-poudre
  warning:
    light: vert-profond
    dark: dore
  danger:
    light: vert-profond
    dark: rose-poudre
  light: creme
  dark: vert-profond

typography:
  fonts:
    - family: "Playfair Display"
      source: file
      files:
        - path: _extensions/vintage/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
          style: normal
        - path: _extensions/vintage/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
          style: normal
        - path: _extensions/vintage/fonts/PlayfairDisplay-Italic.ttf
          weight: 400
          style: italic
        - path: _extensions/vintage/fonts/PlayfairDisplay-BoldItalic.ttf
          weight: 700
          style: italic
    - family: "Inter"
      source: file
      files:
        - path: _extensions/vintage/fonts/Inter-SemiBold.ttf
          weight: 600
          style: normal
  base:
    family: "Playfair Display"
    size: "1.05em"
    line-height: 1.65
  headings:
    family: "Playfair Display"
    weight: 700
  monospace:
    size: "0.9em"
