name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Un lancement manuel sur une autre branche ne doit pas publier sur Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.10.19'
      - name: Installer TeX Live pour les PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended texlive-lang-french
          for f in scrartcl.cls scrlayer-scrpage.sty lastpage.sty enumitem.sty tikz.sty \
                   bookmark.sty xurl.sty fontspec.sty unicode-math.sty frenchb.ldf \
                   pgflibrarypatterns.code.tex; do
            kpsewhich "$f" > /dev/null || { echo "Fichier TeX manquant : $f"; exit 1; }
          done
      - name: Installer les dépendances figées
        run: python -m pip install -r scripts/requirements.txt
      - name: Tester les contrôles
        run: python -m unittest discover -s scripts/tests -v
      - name: Vérifier les sources
        run: python scripts/verifier_sources.py
      - name: Construire HTML et PDF
        run: quarto render --no-execute
      - name: Vérifier les sorties
        run: python scripts/verifier_site.py
      - name: Joindre les PDF pour relecture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-relecture-publication
          path: _site/**/*.pdf
          if-no-files-found: warn
          retention-days: 14
      - name: Préparer le site validé pour Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
