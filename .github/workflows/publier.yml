name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Un lancement manuel sur une autre branche ne doit pas publier sur Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.10.19'
      - name: Installer les dépendances figées
        run: python -m pip install -r scripts/requirements.txt
      - name: Tester les contrôles
        run: python -m unittest discover -s scripts/tests -v
      - name: Vérifier les sources
        run: python scripts/verifier_sources.py
      - name: Construire HTML et PDF
        run: quarto render --no-execute
      - name: Vérifier les sorties
        run: python scripts/verifier_site.py
      - name: Joindre les PDF pour relecture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdf-relecture-publication
          path: _site/**/*.pdf
          if-no-files-found: warn
          retention-days: 14
      - name: Préparer le site validé pour Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
