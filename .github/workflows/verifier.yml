name: Vérifier le site

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Vérifier les ressources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.10.19'
      - name: Installer TeX Live pour les PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended texlive-lang-french
          for f in scrartcl.cls scrlayer-scrpage.sty lastpage.sty enumitem.sty tikz.sty \
                   bookmark.sty xurl.sty fontspec.sty unicode-math.sty babel-french.ldf \
                   pgflibrarypatterns.code.tex; do
            kpsewhich "$f" > /dev/null || { echo "Fichier TeX manquant : $f"; exit 1; }
          done
      - name: Installer les dépendances figées
        run: python -m pip install -r scripts/requirements.txt
      - name: Tester les contrôles
        run: python -m unittest discover -s scripts/tests -v
      - name: Vérifier les sources
        run: python scripts/verifier_sources.py
      - name: Construire HTML et PDF
        run: quarto render --no-execute
      - name: Vérifier les sorties
        run: python scripts/verifier_site.py
      - name: Joindre les PDF pour relecture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-relecture-pr-${{ github.event.pull_request.number }}
          path: _site/**/*.pdf
          if-no-files-found: warn
          retention-days: 14
