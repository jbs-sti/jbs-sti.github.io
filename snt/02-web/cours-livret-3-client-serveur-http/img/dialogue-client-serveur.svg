<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210">
  <title>Le dialogue entre le client et le serveur</title>
  <desc>Le navigateur envoie GET /index.html au serveur www.monlycee.fr, qui renvoie 200 OK et le fichier HTML.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1000" height="210" fill="#fff"/>
  <g stroke="#222" stroke-width="2">
    <rect x="12" y="57" width="220" height="100" rx="8" fill="#ddd"/>
    <rect x="768" y="57" width="220" height="100" rx="8" fill="#f3f3f3"/>
    <path d="M 232 85 H 768" fill="none" marker-end="url(#fleche)"/>
    <path d="M 768 130 H 232" fill="none" marker-end="url(#fleche)"/>
  </g>
  <g font-family="sans-serif" font-size="22" fill="#111" text-anchor="middle">
    <text x="122" y="97" font-weight="bold">CLIENT</text>
    <text x="122" y="129">navigateur</text>
    <text x="878" y="97" font-weight="bold">SERVEUR</text>
    <text x="878" y="129" font-family="monospace" font-size="20">www.monlycee.fr</text>
    <text x="500" y="65">requête : <tspan font-family="monospace">GET /index.html</tspan></text>
    <text x="500" y="168">réponse : <tspan font-family="monospace">200 OK</tspan> + fichier HTML</text>
  </g>
</svg>
