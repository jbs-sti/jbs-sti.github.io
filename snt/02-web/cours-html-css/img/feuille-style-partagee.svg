<rect width="900" height="270" fill="#fff"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#222"/></marker></defs>
<g stroke="#222" stroke-width="2">
<rect x="28" y="20" width="286" height="76" rx="6" fill="#fff"/>
<rect x="28" y="146" width="286" height="76" rx="6" fill="#fff"/>
<rect x="585" y="84" width="282" height="76" rx="6" fill="#ddd"/>
<path d="M314 58H420L577 110" fill="none" marker-end="url(#fleche)"/>
<path d="M314 184H420L577 135" fill="none" marker-end="url(#fleche)"/>
</g>
<g font-family="monospace" font-size="29" text-anchor="middle" fill="#111">
