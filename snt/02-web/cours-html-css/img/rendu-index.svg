<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="titre description">
<title id="titre">La page index.html dans le navigateur</title>
<desc id="description">Onglet Ma première page et adresse file:///…/demo-web/index.html. Le titre est centré, lycée est en gras et le lien page de connexion est souligné.</desc>
<rect width="960" height="390" fill="#fff"/>
<rect x="2" y="2" width="956" height="386" rx="10" fill="#f5f5f5" stroke="#222" stroke-width="2"/>
<path d="M3 45H957 M3 96H957" stroke="#555" stroke-width="2"/>
<rect x="22" y="10" width="270" height="35" rx="6" fill="#fff" stroke="#777"/>
<text x="40" y="34" font-family="sans-serif" font-size="20" fill="#111">Ma première page</text>
<rect x="26" y="56" width="908" height="30" rx="5" fill="#fff" stroke="#777"/>
<text x="45" y="78" font-family="sans-serif" font-size="19" fill="#111">file:///…/demo-web/index.html</text>
<g font-family="serif" fill="#111">
<text x="480" y="151" text-anchor="middle" font-size="38" font-weight="bold">Bienvenue sur ma page</text>
<text x="35" y="209" font-size="26">Je suis élève de seconde.</text>
<text x="35" y="242" font-size="26">Ce paragraphe présente mon <tspan font-weight="bold">lycée</tspan>.</text>
<text x="35" y="295" font-size="26">Mon loisir préféré est la robotique.</text>
<text x="35" y="350" font-size="26">Pour tester un formulaire, va sur la <tspan text-decoration="underline">page de connexion</tspan>.</text>
</g>
</svg>
