<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="titre description">
<title id="titre">Une balise entoure un contenu</title>
<desc id="description">&lt;p&gt; ouvre la balise, Bonjour est le contenu, &lt;/p&gt; ferme la balise avec une barre oblique.</desc>
<rect width="900" height="240" fill="#fff"/>
<g stroke="#222" stroke-width="2">
<rect x="66" y="25" width="160" height="72" rx="5" fill="#ddd"/>
<rect x="300" y="25" width="300" height="72" rx="5" fill="#fff" stroke-dasharray="7 5"/>
<rect x="674" y="25" width="160" height="72" rx="5" fill="#ddd"/>
<path d="M146 97V135 M450 97V135 M754 97V135"/>
</g>
<g font-family="monospace" font-size="34" text-anchor="middle" fill="#111">
<text x="146" y="72">&lt;p&gt;</text><text x="450" y="72">Bonjour</text><text x="754" y="72">&lt;/p&gt;</text>
</g>
<g font-family="sans-serif" font-size="25" text-anchor="middle" fill="#111">
<text x="146" y="171">on ouvre</text><text x="450" y="171">le contenu</text><text x="754" y="171">on ferme</text>
<text x="754" y="209" font-size="21">barre oblique /</text>
</g>
</svg>
