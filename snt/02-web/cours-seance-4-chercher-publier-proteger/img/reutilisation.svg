<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-labelledby="title">
  <title id="title">La réutilisation d’une photo en ligne est-elle autorisée ?</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker></defs>
  <rect width="900" height="160" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111"><rect x="15" y="45" width="300" height="100" rx="12" fill="#f5f5f5" stroke="#222" stroke-width="2"/><text x="165" y="80.5" text-anchor="middle" dominant-baseline="middle" font-size="23">Une photo</text><text x="165" y="109.5" text-anchor="middle" dominant-baseline="middle" font-size="23">trouvée sur le Web</text><rect x="585" y="45" width="300" height="100" rx="12" fill="#f5f5f5" stroke="#222" stroke-width="2"/><text x="735" y="80.5" text-anchor="middle" dominant-baseline="middle" font-size="23">Mon exposé</text><text x="735" y="109.5" text-anchor="middle" dominant-baseline="middle" font-size="23">publié en ligne</text><path d="M315,95 L583,95" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="72" text-anchor="middle" font-size="22">autorisé ?</text></g>
</svg>
