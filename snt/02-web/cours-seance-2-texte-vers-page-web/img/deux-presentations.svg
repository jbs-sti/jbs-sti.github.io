<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title">
<title id="title">Le même contenu, deux présentations</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#333333"/></marker></defs>
<rect width="1000" height="250" fill="#ffffff"/>
<rect x="10" y="15" width="480" height="165" rx="12" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="35" y="77" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="bold" fill="#0000ff">Mon lycée</text>
<text x="35" y="135" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="normal" fill="#222222">Je suis élève de seconde.</text>
<text x="250" y="229" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#222222">STYLE A</text>
<rect x="510" y="15" width="480" height="165" rx="12" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="535" y="77" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="bold" fill="#c00000">Mon lycée</text>
<text x="535" y="135" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="normal" fill="#222222">Je suis élève de seconde.</text>
<text x="750" y="229" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#222222">STYLE B</text>
</svg>
