<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="220" viewBox="0 0 1120 220">
  <title>Document 15 — Du Web à la liste de résultats</title>
  <desc>Quatre boîtes reliées par des flèches : le Web, des milliards de pages ; 1. robot, explore, télécharge ; 2. index, mot vers pages ; 3. classement, ordre des résultats. Sous le robot : fait à l'avance, en continu. Sous l'index et le classement : fait quand tu tapes une requête.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1120" height="220" fill="#fff"/>
  <g stroke="#333" stroke-width="1.5">
    <rect x="10" y="24" width="230" height="90" rx="6" fill="#eee"/>
    <rect x="300" y="24" width="230" height="90" rx="6" fill="#ddd"/>
    <rect x="590" y="24" width="230" height="90" rx="6" fill="#fafafa"/>
    <rect x="880" y="24" width="230" height="90" rx="6" fill="#e8e8e8"/>
  </g>
  <g stroke="#222" stroke-width="2" marker-end="url(#fleche)">
    <path d="M240 69 H296"/>
    <path d="M530 69 H586"/>
    <path d="M820 69 H876"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#111" text-anchor="middle" font-size="20">
    <g font-weight="bold" font-size="22">
      <text x="125" y="60">le Web</text>
      <text x="415" y="60">1. robot</text>
      <text x="705" y="60">2. index</text>
      <text x="995" y="60">3. classement</text>
    </g>
    <text x="125" y="91">des milliards de pages</text>
    <text x="415" y="91">explore, télécharge</text>
    <text x="705" y="91">mot → pages</text>
    <text x="995" y="91">ordre des résultats</text>
    <g font-style="italic" font-size="19">
      <text x="415" y="187">fait à l'avance, en continu</text>
      <text x="850" y="187">fait quand tu tapes une requête</text>
    </g>
  </g>
  <g fill="none" stroke="#777" stroke-width="1.2">
    <path d="M300 138 Q300 148 310 148 H405 Q415 148 415 157 Q415 148 425 148 H520 Q530 148 530 138"/>
    <path d="M590 138 Q590 148 600 148 H840 Q850 148 850 157 Q850 148 860 148 H1100 Q1110 148 1110 138"/>
  </g>
</svg>
