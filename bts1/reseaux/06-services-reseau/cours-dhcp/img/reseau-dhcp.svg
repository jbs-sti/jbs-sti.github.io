<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
<title id="title">Réseau local du cours DHCP</title>
<desc id="desc">Deux clients, un serveur DHCP et DNS et une passerelle sont reliés au même commutateur. La plage dynamique contient vingt adresses.</desc>
<rect width="900" height="320" fill="white"/>
<g fill="none" stroke="#222" stroke-width="2">
<rect x="15" y="25" width="200" height="90" rx="6"/><rect x="235" y="25" width="200" height="90" rx="6"/>
<rect x="455" y="25" width="200" height="90" rx="6"/><rect x="675" y="25" width="210" height="90" rx="6" stroke-dasharray="7 4"/>
<rect x="315" y="180" width="270" height="55" rx="6"/>
<path d="M115 115 V207 H315 M335 115 V180 M555 115 V180 M780 115 V207 H585"/>
</g>
<g font-family="sans-serif" font-size="19" text-anchor="middle" fill="#111">
<text x="115" y="55">Client A</text><text x="115" y="87">Adresse à obtenir</text>
<text x="335" y="55">Client B</text><text x="335" y="87">Adresse à obtenir</text>
<text x="555" y="52">Serveur S</text><text x="555" y="78">DHCP / DNS</text><text x="555" y="103">192.168.10.2/24</text>
<text x="780" y="55">Passerelle G</text><text x="780" y="87">192.168.10.1/24</text>
<text x="450" y="202">Commutateur</text><text x="450" y="226">Même VLAN</text>
<text x="450" y="273">Réseau : 192.168.10.0/24</text>
<text x="450" y="301">Plage DHCP : 192.168.10.100 à 192.168.10.119</text>
</g></svg>
