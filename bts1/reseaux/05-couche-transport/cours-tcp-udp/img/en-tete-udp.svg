<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="title desc">
<title id="title">En-tête UDP</title>
<desc id="desc">Deux lignes de 32 bits : port source et port destination, puis longueur et somme de contrôle. Les données suivent.</desc>
<rect width="800" height="250" fill="white"/>
<g font-family="sans-serif" font-size="15" fill="#111">
<text x="120" y="30">bit 0</text><text x="440" y="30" text-anchor="middle">16</text><text x="760" y="30" text-anchor="end">31</text>
<text x="20" y="30">Octet</text><text x="60" y="75" text-anchor="middle">0</text><text x="60" y="125" text-anchor="middle">4</text><text x="60" y="175" text-anchor="middle">8</text>
</g>
<g fill="none" stroke="#222" stroke-width="2">
<rect x="120" y="45" width="320" height="50"/><rect x="440" y="45" width="320" height="50"/>
<rect x="120" y="95" width="320" height="50"/><rect x="440" y="95" width="320" height="50"/>
<rect x="120" y="145" width="640" height="50" stroke-dasharray="8 5"/>
</g>
<g font-family="sans-serif" font-size="18" fill="#111" text-anchor="middle">
<text x="280" y="76">Port source (16 bits)</text><text x="600" y="76">Port destination (16 bits)</text>
<text x="280" y="126">Longueur (16 bits)</text><text x="600" y="126">Somme de contrôle (16 bits)</text>
<text x="440" y="176">Données (taille variable)</text>
</g>
<g font-family="sans-serif" font-size="16" fill="#111" text-anchor="middle">
<text x="440" y="230">En-tête : 2 lignes de 32 bits = 8 octets, toujours.</text>
</g></svg>
